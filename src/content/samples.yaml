- id: passport-docs
  title: Passport documentation
  product: Passport, a Postman product
  url: https://docs.usepassport.ai
  summary: >-
    Docs for Passport, a secure API access system that lets teams call
    authenticated APIs without distributing or exposing real secrets.
  audience: Developers, and the administrators who govern their API access
  role: >-
    I own the docs end to end: information architecture, task-based guides,
    and the Passport CLI reference. I also maintain the API reference,
    generated from an OpenAPI spec.
  tools:
    - Fern
    - OpenAPI
    - Markdown
    - Git
    - AI-assisted writing
  order: 1

- id: postman-runners
  title: Monitor internal APIs with runners
  product: Postman Private API Monitoring
  url: https://learning.postman.com/docs/monitoring-your-api/runners/overview
  summary: >-
    Documentation for Private API Monitoring, which lets enterprise teams run
    API monitors on runners inside their own network to test internal APIs
    without exposing them to the public internet.
  audience: Enterprise teams that need to monitor private APIs securely
  role: >-
    I wrote the feature documentation, covering runner setup, Docker
