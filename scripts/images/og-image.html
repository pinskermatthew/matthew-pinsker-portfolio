<!doctype html>
<!-- Source for the social share image (Open Graph), shown when the site is
     linked on LinkedIn, Slack, and so on. Rendered by scripts/generate-images.sh.
     Keep the name and headline in sync with src/content/profile.yaml. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Source Serif 4 Variable';
    src: url('../../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-opsz-normal.woff2') format('woff2');
    font-weight: 200 900;
  }
  @font-face {
    font-family: 'Inter Variable';
    src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
  }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    box-sizing: border-box;
    background: #faf7f2;
    color: #1f1d1a;
    padding: 88px 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-left: 24px solid #9a3412;
  }
  h1 {
    font-family: 'Source Serif 4 Variable', Georgia, serif;
    font-weight: 700;
    font-size: 112px;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0 0 32px;
  }
  p {
    font-family: 'Inter Variable', system-ui, sans-serif;
    font-weight: 500;
    font-size: 44px;
    line-height: 1.3;
    margin: 0;
    max-width: 900px;
  }
  .domain {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 30px;
    color: #9a3412;
  }
</style>
</head>
<body>
  <div>
    <h1>Matthew Pinsker</h1>
    <p>Technical writer who builds AI-powered documentation workflows</p>
  </div>
  <div class="domain">matthewpinsker.com</div>
</body>
</html>
